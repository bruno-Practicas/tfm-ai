name: Build and Deploy TFM

on:
  push:
    branches:
      - helm

jobs:
  build:
    name: Construir y Subir a GHCR (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - entorno: "Fabio"
            secret_url: "VITE_API_URL_FABIO"
            secret_key: "VITE_CHAT_API_KEY_FABIO"
            host: "fabio.helmcode.com"
          - entorno: "Bruno"
            secret_url: "VITE_API_URL_BRUNO"
            secret_key: "VITE_CHAT_API_KEY_BRUNO"
            host: "bruno.helmcode.com"

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets[matrix.secret_url] }}
            VITE_CHAT_API_KEY=${{ secrets[matrix.secret_key] }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:sha-${{ env.SHORT_SHA }}-${{ matrix.entorno }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ matrix.entorno }}-latest

  deploy-secrets:
    name: Actualizar Secretos y Desplegar K8s
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - entorno: "Fabio"
            host: "fabio.helmcode.com"
          - entorno: "Bruno"
            host: "bruno.helmcode.com"

    steps:
      - name: Ejecutar despliegue con Helm en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEYS_PROD }}
          script: |
            kubectl create secret generic tfm-ai-api-secrets \
              --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --from-literal=MASTER_API_KEY="${{ secrets.MASTER_API_KEY }}" \
              -n tfm-ai-api \
              --dry-run=client -o yaml | kubectl apply -f -

            RELEASE_NAME=$(echo "${{ matrix.entorno }}" | tr '[:upper:]' '[:lower:]')

            helm upgrade --install ${RELEASE_NAME}-front ./helm-chart \
              --namespace tfm-ai-front \
              --create-namespace \
              --set image.tag=${{ matrix.entorno }}-latest \
              --set ingress.host=${{ matrix.host }} \
              --set entorno=${{ matrix.entorno }}
