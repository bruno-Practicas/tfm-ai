name: Build and Deploy TFM

on:
  push:
    branches:
      - helm

jobs:
  build:
    name: Construir y Subir a GHCR (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - entorno: "Fabio"
            secret_url: "VITE_API_URL_FABIO"
            secret_key: "VITE_CHAT_API_KEY_FABIO"
          - entorno: "Bruno"
            secret_url: "VITE_API_URL_BRUNO"
            secret_key: "VITE_CHAT_API_KEY_BRUNO"
    outputs:
      # Guardamos el SHA corto para usarlo en el siguiente job
      short_sha: ${{ env.SHORT_SHA }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets[matrix.secret_url] }}
            VITE_CHAT_API_KEY=${{ secrets[matrix.secret_key] }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:sha-${{ env.SHORT_SHA }}-${{ matrix.entorno }}
            ghcr.io/${{ env.REPO_LOWER }}:${{ matrix.entorno }}-latest

  deploy:
    name: Actualizar GitOps y Secretos (${{ matrix.entorno }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - entorno: "Fabio"
            entorno_lower: "fabio"
          - entorno: "Bruno"
            entorno_lower: "bruno"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Necesario para poder hacer git push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar despliegue de Secretos en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEYS_PROD }}
          script: |
            kubectl get namespace tfm-ai-api >/dev/null 2>&1 || kubectl create namespace tfm-ai-api

            kubectl create secret generic tfm-ai-api-secrets \
              --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --from-literal=MASTER_API_KEY="${{ secrets.MASTER_API_KEY }}" \
              -n tfm-ai-api \
              --dry-run=client -o yaml | kubectl apply -f -

      - name: Actualizar etiqueta de imagen en Helm (GitOps)
        run: |
          # 1. Configurar usuario de Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Descargar últimos cambios por si el otro entorno ya hizo push
          git pull origin helm

          # 3. Usar sed para reemplazar el tag en el archivo correspondiente
          NUEVO_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)-${{ matrix.entorno }}"
          sed -i "s/tag: .*/tag: $NUEVO_TAG/g" PracticasBrunoFront/tfm-ai/helm-chart/values-${{ matrix.entorno_lower }}.yaml

          # 4. Hacer commit y push
          git add PracticasBrunoFront/tfm-ai/helm-chart/values-${{ matrix.entorno_lower }}.yaml
          git commit -m "chore(gitops): update image tag for ${{ matrix.entorno }} to $NUEVO_TAG [skip ci]" || echo "No changes to commit"
          git push origin helm
