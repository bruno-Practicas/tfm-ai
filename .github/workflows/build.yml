name: Deploy FrontEnd to GHCR

on:
  push:
    branches:
      - dev # (He puesto dev si es la rama que estás usando, si no, déjalo en main)

jobs:
  build:
    name: 'Construir y Subir a GHCR'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear Short Hash
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./tfm-ai
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-$SHORT_SHA
            ghcr.io/${{ github.repository }}:latest
