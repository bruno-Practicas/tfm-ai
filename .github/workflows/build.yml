name: Build and Deploy TFM

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Construir y Subir a GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear archivo .env
        run: |
          cat << EOF > .env
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_CHAT_API_KEY=${{ secrets.VITE_CHAT_API_KEY }}
          EOF

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.REPO_LOWER }}:latest

  deploy-secrets:
    name: Introducir Secretos y Reiniciar K8s
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar despliegue en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEYS_PROD }}
          script: |
            echo "Aplicando secretos del Frontend..."
            kubectl create secret generic frontend-secret \
              --from-literal=VITE_API_URL="${{ secrets.VITE_API_URL }}" \
              --from-literal=VITE_CHAT_API_KEY="${{ secrets.VITE_CHAT_API_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl rollout restart deployment tfm-ai

            echo "Aplicando secretos del Backend..."
            kubectl create secret generic tfm-ai-api-secrets \
              --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              --from-literal=MASTER_API_KEY="${{ secrets.MASTER_API_KEY }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl rollout restart deployment tfm-ai-api
