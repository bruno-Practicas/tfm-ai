name: Deploy FrontEnd a GHCR

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Construir y Subir a GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar variables de entorno (Short SHA y Repo en minusculas)
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear archivo .env
        run: |
          cat << EOF > .env
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_CHAT_API_KEY=${{ secrets.VITE_CHAT_API_KEY }}
          EOF

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.REPO_LOWER }}:latest
