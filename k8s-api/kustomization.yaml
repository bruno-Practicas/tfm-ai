apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - https://raw.githubusercontent.com/FabioCubas101/tfm-ai-api/refs/heads/main/k8s/01-deployment.yaml
  - https://raw.githubusercontent.com/FabioCubas101/tfm-ai-api/refs/heads/main/k8s/02-service.yaml
  - https://raw.githubusercontent.com/FabioCubas101/tfm-ai-api/refs/heads/main/k8s/03-ingress.yaml
  - 00-secret-api.yaml

patches:
  - target:
      kind: Ingress
      name: tfm-ai-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: bruno-api.helmcode.com

      - op: replace
        path: /spec/tls/0/hosts/0
        value: bruno-api.helmcode.com
