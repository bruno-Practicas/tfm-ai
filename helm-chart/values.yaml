replicaCount: 1

image:
  repository: ghcr.io/fabiocubas101/tfm-ai-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: "ghcr-pull-secret"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  host: "bruno-api.helmcode.com"
  certResolver: "letsencrypt"

secrets:
  name: "tfm-ai-api-secrets"

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"
